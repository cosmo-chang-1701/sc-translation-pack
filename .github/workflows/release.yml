name: Auto Release and Discord Notify

on:
  push:
    tags:
      - 'v*.*.*-v*'

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    environment: Prod
    permissions:
      contents: write

    steps:
      - name: 檢出儲存庫代碼
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 取得版本號與格式化日期
        id: vars
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "GAME_VERSION=${VERSION%%-*}" >> $GITHUB_OUTPUT
          # 設定台北時間 (UTC+8)
          echo "DATE=$(TZ='Asia/Taipei' date +'%Y-%m-%d %H:%M')" >> $GITHUB_OUTPUT

      - name: 取得前一版本與比對連結
        id: diff
        run: |
          # 取得當前 Tag 之前的最新一個 Tag
          # 使用 git tag 列表找出前一個版本
          PREV_TAG=$(git tag --list 'v*' --sort=-v:refname --merged HEAD | sed -n '2p')

          if [ -z "$PREV_TAG" ]; then
            echo "沒有找到前一個版本，跳過比對連結。"
            echo "HAS_PREV=false" >> $GITHUB_OUTPUT
          else
            echo "找到前一版本: $PREV_TAG"
            echo "PREV_TAG=$PREV_TAG" >> $GITHUB_OUTPUT
            echo "HAS_PREV=true" >> $GITHUB_OUTPUT
            # 產生 GitHub 比對連結
            echo "COMPARE_URL=https://github.com/${{ github.repository }}/compare/$PREV_TAG...${{ steps.vars.outputs.VERSION }}" >> $GITHUB_OUTPUT
          fi

      - name: 打包翻譯檔 (ZIP)
        run: |
          # 打包繁體中文資料夾
          zip -r "sc-localization-zh-TW-${{ steps.vars.outputs.VERSION }}.zip" "./chinese_(traditional)/"

      - name: 建立 GitHub Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.VERSION }}
          name: "Release ${{ steps.vars.outputs.VERSION }}"
          generate_release_notes: true
          body: |
            ## 星際公民非官方多國語系更新
            - **發布日期**: ${{ steps.vars.outputs.DATE }} (台北時間)
            - **版本號**: ${{ steps.vars.outputs.VERSION }}
            - **對應遊戲版本**: ${{ steps.vars.outputs.GAME_VERSION }}

            ## 語系檔說明
            zh-TW: 繁體中文
            
            *此版本由 GitHub Actions 自動生成並打包發布。*
          files: |
            sc-localization-zh-TW-${{ steps.vars.outputs.VERSION }}.zip

      - name: Discord 通知
        uses: sarisia/actions-status-discord@v1
        if: success()
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          color: 0x00ff00
          username: "翻譯更新發佈助手"
          content: "<@&${{ secrets.DISCORD_ROLE_ID }}>"
          title: "🚀 星際公民非官方多國語系更新：${{ steps.vars.outputs.VERSION }}"
          description: |
            最新的星際公民非官方多國語系已經發布！
            
            📅 **發布日期**: ${{ steps.vars.outputs.DATE }} (台北時間)
            📦 **版本號**: ${{ steps.vars.outputs.VERSION }}
            🎮 **對應遊戲版本**: ${{ steps.vars.outputs.GAME_VERSION }}

            語系檔說明
            zh-TW: 繁體中文
            
            [**👉 前往 GitHub 下載最新翻譯**](https://github.com/${{ github.repository }}/releases/latest)

            ${{ steps.diff.outputs.HAS_PREV == 'true' && format('🔍 [查看與前版 {0} 的差異比對]({1})', steps.diff.outputs.PREV_TAG, steps.diff.outputs.COMPARE_URL) || '' }}